<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>STL 檢視器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* 版面：左邊大 3D 視窗（像切片軟體的列印平台），右邊一欄工具；手機改上下排 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --line:#d5dbe2; --fg:#1d2733; --mute:#5f6b78;
  --accent:#e2630f; --accent-ink:#ffffff; --bed:#f7f9fb; --grid:#c9d1da; --grid2:#e1e6ec;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#c53030; --soft:#f4f6f8;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --line:#2c3642; --fg:#e4e9ef; --mute:#93a0ae;
  --accent:#f0813a; --accent-ink:#1a1006; --bed:#161c23; --grid:#3a4553; --grid2:#252e38;
  --ok:#4cc38a; --warn:#e0a84a; --bad:#f07070; --soft:#202832; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --line:#2c3642; --fg:#e4e9ef; --mute:#93a0ae;
  --accent:#f0813a; --accent-ink:#1a1006; --bed:#161c23; --grid:#3a4553; --grid2:#252e38;
  --ok:#4cc38a; --warn:#e0a84a; --bad:#f07070; --soft:#202832; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
h1 small{font-family:var(--f-num);font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.sp{flex:1}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding-bottom:12px}
#stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bed);min-height:300px;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mute);pointer-events:none}
#views{position:absolute;top:10px;left:10px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#views .btn{padding:3px 9px;font-size:12px}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);border-radius:12px;font-size:20px;font-weight:700;color:var(--fg)}
#stage.dragging #drop{display:flex}
#measureTag{position:absolute;padding:3px 8px;border-radius:6px;background:var(--fg);color:var(--panel);font-family:var(--f-num);font-size:13px;pointer-events:none;transform:translate(-50%,-130%);white-space:nowrap}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;min-width:0;display:flex;flex-direction:column;gap:16px}
section h2{font-size:12px;letter-spacing:.08em;color:var(--mute);margin:0 0 8px;font-weight:700}
.files{display:flex;flex-direction:column;gap:4px}
.file{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0}
.file.sel{border-color:var(--accent);background:var(--soft)}
.file .sw{width:12px;height:12px;border-radius:3px;flex:none}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file button{border:0;background:none;color:var(--mute);cursor:pointer;font:inherit;padding:0 4px}
.file button:hover{color:var(--fg)}
.empty{color:var(--mute);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.kv dt{color:var(--mute);font-size:13px}
.kv dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.big{font-size:22px;font-weight:600}
.unit{font-size:12px;color:var(--mute);margin-left:3px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-family:var(--f-body)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.chk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0}
select,input[type=number]{font:inherit;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=number]{width:70px;font-family:var(--f-num)}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{font-size:12px;color:var(--mute);margin:6px 0 0}
#mres{font-family:var(--f-num);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  html,body{height:auto}
  main{grid-template-columns:1fr}
  #stage{height:58vh}
  aside{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>STL 檢視器<small>單位 mm</small></h1>
  <div class="sp"></div>
  <button class="btn pri" id="openBtn">開啟 STL 檔</button>
  <input type="file" id="fileIn" accept=".stl,.zip" multiple hidden>
</header>
<main>
  <div id="stage">
    <div id="views">
      <button class="btn" data-view="iso">等角</button><button class="btn" data-view="front">前</button><button class="btn" data-view="back">後</button><button class="btn" data-view="left">左</button><button class="btn" data-view="right">右</button><button class="btn" data-view="top">上</button><button class="btn" data-view="bottom">下（底面）</button>
    </div>
    <div id="hint">左鍵拖曳旋轉　右鍵或兩指拖曳平移　滾輪或兩指縮放　可以直接把檔案拖進來</div>
    <div id="measureTag" hidden></div>
    <div id="drop">放開就開啟</div>
  </div>
  <aside>
    <section>
      <h2>檔案</h2>
      <div class="files" id="files"></div>
      <p class="note">支援 .stl（二進位或文字格式），也能直接開燈框設計器下載的 .zip。檔案只在這台電腦的瀏覽器裡讀，不會上傳。</p>
    </section>
    <section>
      <h2 id="infoTitle">尺寸</h2>
      <dl class="kv" id="info"></dl>
    </section>
    <section>
      <h2>重量估計</h2>
      <div class="row">
        <select id="mat" aria-label="材料">
          <option value="1.24">PLA（1.24 g/cm³）</option>
          <option value="1.27">PETG（1.27）</option>
          <option value="1.04">ABS（1.04）</option>
          <option value="1.07">ASA（1.07）</option>
          <option value="1.21">TPU（1.21）</option>
        </select>
        <label class="row" style="gap:4px">× <input type="number" id="fac" value="1.00" step="0.01" min="0.1" max="1.5" aria-label="校正係數"></label>
      </div>
      <dl class="kv" style="margin-top:8px"><dt>估計重量</dt><dd><span class="big" id="wt">—</span><span class="unit">g</span></dd></dl>
      <p class="note">用實心體積算。像燈框這種 1 mm 左右的薄件幾乎是實心，填 0.95 跟實秤最接近；厚的零件有填充率，實際會比這輕。</p>
    </section>
    <section>
      <h2>顯示</h2>
      <label class="chk">顯示稜線<input type="checkbox" id="edges" checked></label>
      <label class="chk">顯示列印平台<input type="checkbox" id="bedOn" checked></label>
      <label class="chk">平台大小
        <select id="bedSize"><option value="180">180 × 180（A1 mini）</option><option value="220" selected>220 × 220</option><option value="256">256 × 256（A1／P1S）</option><option value="300">300 × 300</option></select>
      </label>
      <label class="chk" style="display:block">剖面高度：<span id="cutTxt">不切</span>
        <input type="range" id="cut" min="0" max="100" value="100" aria-label="剖面高度">
      </label>
      <p class="note">往左拉就從上面一層一層切掉，可以看內部厚度。切到的地方會顯示成紅色。</p>
    </section>
    <section>
      <h2>量測</h2>
      <div class="row"><button class="btn" id="mBtn">開始量兩點距離</button><button class="btn" id="mClr">清除</button></div>
      <div id="mres" class="note">點模型表面上的兩個點，就會顯示距離。</div>
    </section>
  </aside>
</main>

const orbit = { target: new THREE.Vector3(), dist: 300, theta: -Math.PI / 4 - Math.PI / 2, phi: 0.6 };
function placeCam() {
  const { target: t, dist: d, theta, phi } = orbit;
  camera.position.set(t.x + d * Math.cos(phi) * Math.cos(theta), t.y + d * Math.cos(phi) * Math.sin(theta), t.z + d * Math.sin(phi));
  camera.lookAt(t);
  sun.position.copy(camera.position).add(new THREE.Vector3(40, -30, 120));
  updateMeasureTag();
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); requestDraw();
}
new ResizeObserver(resize).observe(stage);
let drawQueued = false;

const ptrs = new Map(); let gesture = null, moved = 0;
stage.addEventListener('contextmenu', (e) => e.preventDefault());
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#views')) return;
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0; gesture = { pan: e.button === 2 || e.shiftKey };
});
stage.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d0 = Math.hypot(a.x - b.x, a.y - b.y);
    p.x = e.clientX; p.y = e.clientY;
    const [a2, b2] = [...ptrs.values()], d1 = Math.hypot(a2.x - b2.x, a2.y - b2.y);
    if (d0 > 0) orbit.dist = clampDist(orbit.dist * d0 / d1);
    pan(dx / 2, dy / 2);
  } else {
    p.x = e.clientX; p.y = e.clientY;
    if (gesture && gesture.pan) pan(dx, dy);
    else { orbit.theta -= dx * 0.008; orbit.phi = Math.max(-1.55, Math.min(1.55, orbit.phi + dy * 0.008)); }
  }
  requestDraw();
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0 && moved < 6 && measuring) pickPoint(e);
}
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', (e) => { e.preventDefault(); orbit.dist = clampDist(orbit.dist * Math.exp(e.deltaY * 0.0012)); requestDraw(); }, { passive: false });
function clampDist(d) { return Math.max(5, Math.min(3000, d)); }
function pan(dx, dy) {
  const k = orbit.dist * Math.tan(camera.fov * Math.PI / 360) * 2 / stage.clientHeight;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);

function parseSTL(buf) {
  const dv = new DataView(buf);
  if (buf.byteLength >= 84) {
    const n = dv.getUint32(80, true);
    if (84 + n * 50 === buf.byteLength) {
      const pos = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) { const o = 84 + i * 50 + 12; for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + k * 4, true); }
      return pos;
    }
  }
  const txt = new TextDecoder().decode(buf);
  if (!/facet/i.test(txt)) throw new Error('這不是 STL 檔，或檔案壞了');
  const re = /vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g, out = []; let m;
  while ((m = re.exec(txt))) out.push(+m[1], +m[2], +m[3]);
  if (!out.length || out.length % 9) throw new Error('文字格式 STL 讀不完整');
  return new Float32Array(out);
}
async function inflate(u8, fmt) {
  const ds = new DecompressionStream(fmt);
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf); let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('壓縮檔讀不到目錄');
  const cnt = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const out = [];
  for (let k = 0; k < cnt; k++) {
    const flag = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), loc = dv.getUint32(p + 42, true);
    const nameBytes = u8.subarray(p + 46, p + 46 + nl);
    let name; try { name = new TextDecoder((flag & 0x800) ? 'utf-8' : 'utf-8', { fatal: true }).decode(nameBytes); } catch { name = new TextDecoder('big5').decode(nameBytes); }
    p += 46 + nl + el + cl;
    if (!/\.stl$/i.test(name)) continue;
    const ln = dv.getUint16(loc + 26, true), le = dv.getUint16(loc + 28, true), start = loc + 30 + ln + le, data = u8.subarray(start, start + csize);
    let raw;
    if (method === 0) raw = data.slice();
    else if (method === 8) raw = await inflate(data, 'deflate-raw');
    else throw new Error(name + '：不支援的壓縮方式');
    out.push({ name: name.split('/').pop(), buf: raw.buffer });
  }
  if (!out.length) throw new Error('壓縮檔裡沒有 STL');
  return out;
}

// ---------- 模型 ----------
const models = []; let selId = null, nextId = 1;
const matCut = new THREE.MeshBasicMaterial({ color: 0xd63a3a, side: THREE.BackSide, clippingPlanes: [cutPlane], polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
function addModel(name, pos) {
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.computeVertexNormals(); geo.computeBoundingBox();
  const color = COLORS[(nextId - 1) % COLORS.length];
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0.02, side: THREE.FrontSide, clippingPlanes: [cutPlane] });
  const g = new THREE.Group(), mesh = new THREE.Mesh(geo, mat), back = new THREE.Mesh(geo, matCut);
  g.add(mesh, back);
  let edges = null;
  try { edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({ color: 0x0b1015, transparent: true, opacity: 0.35, clippingPlanes: [cutPlane] })); edges.visible = $('edges').checked; g.add(edges); } catch {}
  world.add(g);
  const m = { id: nextId++, name, pos, geo, g, mesh, edges, color, visible: true, stats: computeStats(pos) };
  models.push(m); selId = m.id; layout(); renderFiles(); renderInfo(); fitView();
  return m;
}
function computeStats(p) {
  let vol = 0, area = 0; const n = p.length / 9;
  for (let i = 0; i < p.length; i += 9) {
    const ax = p[i], ay = p[i + 1], az = p[i + 2], bx = p[i + 3], by = p[i + 4], bz = p[i + 5], cx = p[i + 6], cy = p[i + 7], cz = p[i + 8];
    vol += (ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx)) / 6;
    const ux = bx - ax, uy = by - ay, uz = bz - az, wx = cx - ax, wy = cy - ay, wz = cz - az;
    area += Math.hypot(uy * wz - uz * wy, uz * wx - ux * wz, ux * wy - uy * wx) / 2;
  }
  // 封閉檢查：每條邊要剛好被兩個三角形共用
  const key = (i) => p[i] + ',' + p[i + 1] + ',' + p[i + 2];
  const vid = new Map(), id = (i) => { const k = key(i); let v = vid.get(k); if (v === undefined) { v = vid.size; vid.set(k, v); } return v; };
  const E = new Map();
  for (let t = 0; t < n; t++) {
    const a = id(t * 9), b = id(t * 9 + 3), c = id(t * 9 + 6);
    for (const [u, v] of [[a, b], [b, c], [c, a]]) { const k = u < v ? u * 4194304 + v : v * 4194304 + u; E.set(k, (E.get(k) || 0) + 1); }
  }
  let open = 0, nonman = 0; for (const c of E.values()) { if (c === 1) open++; else if (c > 2) nonman++; }
  return { tris: n, vol: Math.abs(vol), area, open, nonman, flipped: vol < 0 };
}
function layout() {
  // 整組放到平台中央、底面貼平台（Z=0）
  const box = new THREE.Box3(); world.position.set(0, 0, 0);
  for (const m of models) if (m.visible) box.union(m.geo.boundingBox);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  world.position.set(-c.x, -c.y, -box.min.z);
}
function worldBox() { const b = new THREE.Box3(); for (const m of models) if (m.visible) b.expandByObject(m.mesh); return b; }
function fitView() {
  world.updateMatrixWorld(true);
  const b = worldBox(); if (b.isEmpty()) { requestDraw(); return; }
  const s = b.getBoundingSphere(new THREE.Sphere());
  orbit.target.copy(s.center); orbit.dist = clampDist(s.radius / Math.sin(camera.fov * Math.PI / 360) * 1.15);
  updateCutRange(); requestDraw();
}
function removeModel(id) {
  const i = models.findIndex((m) => m.id === id); if (i < 0) return;
  const m = models[i]; world.remove(m.g); m.geo.dispose(); models.splice(i, 1);
  if (selId === id) selId = models.length ? models[models.length - 1].id : null;
  clearMeasure(); layout(); renderFiles(); renderInfo(); fitView();
}

// ---------- 介面 ----------
const fmt = (v, d = 1) => Number(v).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
function renderFiles() {
  const box = $('files'); box.innerHTML = '';
  if (!models.length) { box.innerHTML = '<div class="empty">還沒有開檔。按上面「開啟 STL 檔」，或把檔案拖到左邊的視窗。</div>'; return; }
  for (const m of models) {
    const d = document.createElement('div'); d.className = 'file' + (m.id === selId ? ' sel' : '');
    d.innerHTML = `<span class="sw" style="background:${hex(m.color)}"></span><span class="nm" title="${esc(m.name)}">${esc(m.name)}</span><button title="顯示／隱藏" aria-label="顯示或隱藏">${m.visible ? '隱藏' : '顯示'}</button><button title="關閉這個檔" aria-label="關閉">✕</button>`;
    d.onclick = () => { selId = m.id; renderFiles(); renderInfo(); };
    const [bv, bx] = d.querySelectorAll('button');
    bv.onclick = (e) => { e.stopPropagation(); m.visible = !m.visible; m.g.visible = m.visible; layout(); renderFiles(); fitView(); };
    bx.onclick = (e) => { e.stopPropagation(); removeModel(m.id); };
    box.appendChild(d);
  }
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function renderInfo() {
  const m = models.find((x) => x.id === selId), el = $('info');
  if (!m) { el.innerHTML = '<dt>—</dt><dd></dd>'; $('wt').textContent = '—'; $('infoTitle').textContent = '尺寸'; return; }
  $('infoTitle').textContent = '尺寸｜' + m.name;
  const b = m.geo.boundingBox, sx = b.max.x - b.min.x, sy = b.max.y - b.min.y, sz = b.max.z - b.min.z, st = m.stats;
  const bed = +$('bedSize').value, fits = sx <= bed && sy <= bed;
  let seal;
  if (st.open === 0) seal = '<span class="pill ok">封閉，可以切片</span>';
  else seal = `<span class="pill bad">有破洞（${st.open} 條邊沒接上）</span>`;
  el.innerHTML = `
    <dt>長 X</dt><dd>${fmt(sx)}<span class="unit">mm</span></dd>
    <dt>寬 Y</dt><dd>${fmt(sy)}<span class="unit">mm</span></dd>
    <dt>高 Z</dt><dd>${fmt(sz)}<span class="unit">mm</span></dd>
    <dt>平台</dt><dd>${fits ? '<span class="pill ok">放得下</span>' : `<span class="pill bad">超出 ${bed} mm 平台</span>`}</dd>
    <dt>體積</dt><dd>${fmt(st.vol / 1000, 2)}<span class="unit">cm³</span></dd>
    <dt>表面積</dt><dd>${fmt(st.area / 100, 1)}<span class="unit">cm²</span></dd>
    <dt>三角面</dt><dd>${st.tris.toLocaleString('zh-TW')}</dd>
    <dt>模型檢查</dt><dd>${seal}</dd>`;
  updateWeight();
}
function updateWeight() {
  const m = models.find((x) => x.id === selId); if (!m) { $('wt').textContent = '—'; return; }
  const w = m.stats.vol / 1000 * (+$('mat').value) * (+$('fac').value || 1);
  $('wt').textContent = fmt(w, 2);
  try { localStorage.setItem('stlv', JSON.stringify({ mat: $('mat').value, fac: $('fac').value, bed: $('bedSize').value })); } catch {}
}
$('mat').onchange = updateWeight; $('fac').oninput = updateWeight;
$('edges').onchange = () => { for (const m of models) if (m.edges) m.edges.visible = $('edges').checked; requestDraw(); };
$('bedOn').onchange = () => { bedG.visible = $('bedOn').checked; requestDraw(); };
$('bedSize').onchange = () => { buildBed(); renderInfo(); requestDraw(); };
try { const s = JSON.parse(localStorage.getItem('stlv') || '{}'); if (s.mat) $('mat').value = s.mat; if (s.fac) $('fac').value = s.fac; if (s.bed) $('bedSize').value = s.bed; } catch {}

// 平台
function buildBed() {
  while (bedG.children.length) { const c = bedG.children.pop(); c.geometry.dispose(); }
  const S = +$('bedSize').value, h = S / 2, minor = [], major = [];
  for (let x = -h; x <= h + 1e-6; x += 10) { const arr = Math.abs(Math.round(x)) % 50 === 0 ? major : minor; arr.push(x, -h, 0, x, h, 0, -h, x, 0, h, x, 0); }
  const mk = (arr, col) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: new THREE.Color(col) })); };
  bedG.add(mk(minor, cssVar('--grid2') || '#e1e6ec'), mk(major, cssVar('--grid') || '#c9d1da'));
  const fr = [-h, -h, 0, h, -h, 0, h, -h, 0, h, h, 0, h, h, 0, -h, h, 0, -h, h, 0, -h, -h, 0];
  bedG.add(mk(fr, cssVar('--accent') || '#e2630f'));
  // 前方標記（平台前緣中間的小三角形）
  const tri = new THREE.BufferGeometry(); tri.setAttribute('position', new THREE.Float32BufferAttribute([-6, -h - 2, 0, 6, -h - 2, 0, 0, -h - 10, 0], 3));
  bedG.add(new THREE.Mesh(tri, new THREE.MeshBasicMaterial({ color: new THREE.Color(cssVar('--accent') || '#e2630f'), side: THREE.DoubleSide })));
}

// 剖面
let cutMax = 100;
function updateCutRange() { const b = worldBox(); cutMax = b.isEmpty() ? 100 : b.max.z; applyCut(); }
function applyCut() {
  const v = +$('cut').value;
  if (v >= 100) { cutPlane.constant = 1e6; $('cutTxt').textContent = '不切'; }
  else { const z = cutMax * v / 100; cutPlane.constant = z; $('cutTxt').textContent = `Z = ${fmt(z)} mm`; }
  requestDraw();
}
$('cut').oninput = applyCut;

// 量測
let measuring = false, mPts = [];
const ray = new THREE.Raycaster();
$('mBtn').onclick = () => { measuring = !measuring; $('mBtn').classList.toggle('on', measuring); $('mBtn').textContent = measuring ? '量測中…（再按一次結束）' : '開始量兩點距離'; stage.style.cursor = measuring ? 'crosshair' : ''; };
$('mClr').onclick = clearMeasure;
function clearMeasure() { mPts = []; while (measureG.children.length) measureG.remove(measureG.children[0]); $('measureTag').hidden = true; $('mres').textContent = '點模型表面上的兩個點，就會顯示距離。'; requestDraw(); }
function pickPoint(e) {
  const r = stage.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hits = ray.intersectObjects(models.filter((m) => m.visible).map((m) => m.mesh)).filter((h) => cutPlane.distanceToPoint(h.point) >= -1e-6);
  if (!hits.length) return;
  if (mPts.length === 2) clearMeasure();
  const p = hits[0].point.clone(); mPts.push(p);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.4, orbit.dist * 0.004), 16, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(cssVar('--accent')), depthTest: false }));
  dot.renderOrder = 10; dot.position.copy(p); measureG.add(dot);
  if (mPts.length === 2) {
    const [a, b] = mPts, g = new THREE.BufferGeometry().setFromPoints([a, b]);
    const ln = new THREE.Line(g, new THREE.LineBasicMaterial({ color: new THREE.Color(cssVar('--accent')), depthTest: false })); ln.renderOrder = 10; measureG.add(ln);
    const d = a.distanceTo(b), dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y), dz = Math.abs(b.z - a.z);
    $('mres').innerHTML = `距離 <b>${fmt(d, 2)} mm</b><br>X ${fmt(dx, 2)}　Y ${fmt(dy, 2)}　Z ${fmt(dz, 2)}`;
  } else $('mres').textContent = '再點第二個點。';
  requestDraw();
}
function updateMeasureTag() {
  const t = $('measureTag'); if (mPts.length !== 2) { t.hidden = true; return; }
  const mid = mPts[0].clone().add(mPts[1]).multiplyScalar(0.5).project(camera);
  t.hidden = false; t.textContent = fmt(mPts[0].distanceTo(mPts[1]), 2) + ' mm';
  t.style.left = ((mid.x + 1) / 2 * stage.clientWidth) + 'px'; t.style.top = ((1 - mid.y) / 2 * stage.clientHeight) + 'px';
}

// 開檔
async function openFiles(list) {
  for (const f of list) {
    try {
      const buf = await f.arrayBuffer();
      if (/\.zip$/i.test(f.name)) { for (const z of await unzip(buf)) addModel(z.name, parseSTL(z.buf)); }
      else addModel(f.name, parseSTL(buf));
    } catch (err) { $('mres').textContent = ''; showError(f.name + '：' + err.message); }
  }
  if (sampleModel && models.length > 1 && models.includes(sampleModel)) removeModel(sampleModel.id), sampleModel = null;
}
function showError(msg) { const box = $('files'); const d = document.createElement('div'); d.className = 'pill bad'; d.style.whiteSpace = 'normal'; d.textContent = msg; box.prepend(d); }
$('openBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = (e) => { openFiles([...e.target.files]); e.target.value = ''; };
['dragenter', 'dragover'].forEach((t) => stage.addEventListener(t, (e) => { e.preventDefault(); stage.classList.add('dragging'); }));
['dragleave', 'drop'].forEach((t) => stage.addEventListener(t, (e) => { e.preventDefault(); if (t === 'drop' || e.target === $('drop')) stage.classList.remove('dragging'); }));
stage.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files.length) openFiles([...e.dataTransfer.files]); });
document.addEventListener('dragover', (e) => e.preventDefault()); document.addEventListener('drop', (e) => { e.preventDefault(); if (!stage.contains(e.target) && e.dataTransfer.files.length) openFiles([...e.dataTransfer.files]); });

// 範例
let sampleModel = null;
async function loadSample() {
  try {
    const bin = Uint8Array.from(atob(SAMPLE_B64), (c) => c.charCodeAt(0)), raw = await inflate(bin, 'gzip'), dv = new DataView(raw.buffer);
    const nv = dv.getUint32(0, true), nt = dv.getUint32(4, true), V = new Float32Array(raw.buffer, 8, nv * 3), I = new Uint32Array(raw.buffer.slice(8 + nv * 12, 8 + nv * 12 + nt * 12));
    const pos = new Float32Array(nt * 9); for (let i = 0; i < nt * 3; i++) { const v = I[i] * 3; pos[i * 3] = V[v]; pos[i * 3 + 1] = V[v + 1]; pos[i * 3 + 2] = V[v + 2]; }
    if (!models.length) sampleModel = addModel('範例｜TC 200I 燈框（v6 樣式）.stl', pos);
  } catch (e) { renderFiles(); }
}

applyTheme(); renderFiles(); renderInfo(); resize(); loadSample();
window.__stlv = { models, camera, world, THREE };
</script>
